name = "wbm-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Secrets (ADMIN_TOKEN) go via `wrangler secret put`.
[vars]
WEATHER_LAT = "59.3293"
WEATHER_LON = "18.0686"
APP_VERSION = "0.0.0"
# Flip to "true" to keep running against the mock client in production (not
# recommended). Unset / any other value routes to the real Google Ads client.
USE_MOCK_GOOGLE_ADS = ""
# Web origin allowed by CORS. Override per-environment.
WEB_ORIGIN = "http://localhost:3000"

# D1 binding. Create the DB with `wrangler d1 create wbm` then paste
# the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "wbm"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "../../migrations"

# Daily cron (02:00 UTC) — wired to a scheduled handler in a later phase.
# [triggers]
# crons = ["0 2 * * *"]
